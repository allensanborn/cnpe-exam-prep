# Every CLI the Makefile's targets call (scripts/01-tools.sh installs the same set).
# Not here: docker, git, curl and the other host packages (scripts/00-host-setup.sh),
# and skopeo, which ships no upstream binaries.
[tools]
# Backstage's create-app only accepts Node 22 or 24.
node = "24.21.0"
# 80-backstage.sh wants classic yarn; 2+ comes from corepack.
yarn = "1.22.22"
python = "3.14.7"
go = "1.27.1"
jq = "1.8.2"
yq = "4.54.1"

kubectl = "1.37.1"
helm = "4.3.0"
kind = "0.33.0"
"github:kubernetes-sigs/cloud-provider-kind" = "0.11.1"
kustomize = "5.8.1"
k9s = "0.51.0"
stern = "1.34.0"
kubectx = "0.11.0"
kubebuilder = "4.16.0"

argocd = "3.5.3"
argo-rollouts = "1.10.0"
argo = "4.1.4"
flux2 = "2.9.5"
tekton-cli = "0.46.1"
crossplane-cli = "2.5.0"

cilium-cli = "0.20.1"
"github:cilium/hubble" = "1.19.4"
istioctl = "1.31.1"
linkerd = "edge-26.9.3"

kubeseal = "0.40.0"
trivy = "0.74.0"
cosign = "3.1.3"
"github:kubecost/kubectl-cost" = "0.6.6"
