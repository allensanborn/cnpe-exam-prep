# Every CLI the Makefile's targets call (scripts/01-tools.sh installs the same set).
# Not here: docker, git, curl and the other host packages (scripts/00-host-setup.sh),
# and skopeo, which ships no upstream binaries.
[tools]
# Backstage's create-app only accepts Node 22 or 24.
node = "24"
# 80-backstage.sh wants classic yarn; 2+ comes from corepack.
yarn = "1"
python = "3.14"
go = "1.27"
jq = "1.8"
yq = "4.54"

kubectl = "1.37"
helm = "4.3"
kind = "0.33"
"github:kubernetes-sigs/cloud-provider-kind" = "0.11"
kustomize = "5.8"
k9s = "0.51"
stern = "1.34"
kubectx = "0.11"
kubebuilder = "4.16"

argocd = "3.5"
argo-rollouts = "1.10"
argo = "4.1"
flux2 = "2.9"
tekton-cli = "0.46"
crossplane-cli = "2.5"

cilium-cli = "0.20"
"github:cilium/hubble" = "1.19"
istioctl = "1.31"
linkerd = "edge"

kubeseal = "0.40"
trivy = "0.74"
cosign = "3.1"
"github:kubecost/kubectl-cost" = "0.6"

[settings]
lockfile = true
# The lab runs on x86_64 Linux; contributors also work on macOS.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
